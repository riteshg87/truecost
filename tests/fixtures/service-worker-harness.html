<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TrueCost service worker harness</title></head>
  <body>
    <main>
      <h1>TrueCost public worker harness</h1>
      <p>This local fixture uses synthetic paths only. It shows the browser state needed for privacy review.</p>
      <p id="controller">Controller: none</p>
      <button id="register">Register /sw.js</button>
      <button id="seed">Seed disposable caches</button>
      <button id="refresh">List cache names and URLs</button>
      <button id="canaries">Run private/API/RSC canaries</button>
      <pre id="output" aria-live="polite"></pre>
    </main>
    <script>
      (() => {
        const output = document.querySelector("#output");
        const controller = document.querySelector("#controller");
        const write = (line) => { output.textContent += `${line}\n`; };
        const refreshController = () => { controller.textContent = `Controller: ${navigator.serviceWorker.controller?.scriptURL ?? "none"}`; };
        async function listCaches() {
          const names = await caches.keys();
          write(`Caches: ${names.join(", ") || "none"}`);
          for (const name of names) write(`  ${name}: ${(await caches.open(name)).keys ? (await (await caches.open(name)).keys()).map((request) => new URL(request.url).pathname).join(", ") : ""}`);
        }
        document.querySelector("#register").onclick = async () => {
          output.textContent = "";
          try {
            const registration = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
            write(`Registered: ${registration.scope}`);
            navigator.serviceWorker.addEventListener("message", (event) => write(`Worker message: ${JSON.stringify(event.data)}`));
            (navigator.serviceWorker.controller ?? registration.active)?.postMessage({ type: "TC_SW_STATUS" });
            refreshController();
          } catch (error) { write(`Register failed: ${error.message}`); }
        };
        document.querySelector("#seed").onclick = async () => {
          await (await caches.open("truecost-v2")).put("/old-private-canary", new Response("legacy"));
          await (await caches.open("fixture-unrelated")).put("/unrelated-canary", new Response("unrelated"));
          write("Seeded truecost-v2 and fixture-unrelated.");
          await listCaches();
        };
        document.querySelector("#refresh").onclick = listCaches;
        document.querySelector("#canaries").onclick = async () => {
          for (const [path, headers] of [["/account", {}], ["/api/private-export", {}], ["/compare/results?_rsc=synthetic", { RSC: "1" }]]) {
            try { const response = await fetch(path, { headers }); write(`${path}: ${response.status} ${response.type}`); }
            catch (error) { write(`${path}: network error (${error.message})`); }
          }
        };
        navigator.serviceWorker?.addEventListener("controllerchange", refreshController);
        refreshController();
      })();
    </script>
  </body>
</html>
