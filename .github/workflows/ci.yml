name: CI

# Every push and every pull request. The finance engine is the product here —
# a wrong APR is not a cosmetic bug — so nothing reaches main unchecked.
on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; no point finishing a run for a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # .nvmrc is the single source of truth, so CI and a laptop cannot drift
      # apart without someone noticing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: honour the lockfile exactly rather than silently
      # resolving a newer dependency than anyone has tested against.
      - name: Install
        run: npm ci

      # Separate steps rather than one chained command, so a red run names the
      # thing that broke instead of just failing.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
